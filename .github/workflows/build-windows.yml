name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 · NSIS + portable
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build frontend bundle
        run: npm run build

      - name: Verify feature registry is in sync
        shell: bash
        run: |
          npm run features
          git diff --exit-code --ignore-cr-at-eol -- FEATURES-300.md

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cargo check
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          cargo check --message-format=short 2>&1 | tee cargo-check.log | python "$GITHUB_WORKSPACE/scripts/annotate-cargo.py"

      - name: Build Tauri bundle (NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Prepare portable executable
        shell: bash
        run: |
          mkdir -p artifacts
          cp "apps/desktop/src-tauri/target/release/aria-image-studio.exe" "artifacts/ARIA-Image-Studio-1.0.0-portable.exe"
          find apps/desktop/src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} "artifacts/ARIA-Image-Studio-1.0.0-setup.exe" \;
          cd artifacts && sha256sum *.exe > SHA256SUMS.txt && ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aria-image-studio-windows-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ARIA Image Studio ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## ARIA Image Studio ${{ github.ref_name }} — Windows x64

            **Install:** run `ARIA-Image-Studio-1.0.0-setup.exe` (per-user, no admin prompt).
            **Portable:** run `ARIA-Image-Studio-1.0.0-portable.exe` from any folder.

            Requirements: Windows 10/11 x64 with WebView2 (preinstalled on Windows 11) and the
            official Codex CLI (`npm install -g @openai/codex`) signed in with your own account.
            No OpenAI API key is used or accepted.

            The installer is unsigned in this release, so SmartScreen may ask for confirmation
            (More info → Run anyway). Verify the download against `SHA256SUMS.txt`.
          files: artifacts/*
          fail_on_unmatched_files: true
