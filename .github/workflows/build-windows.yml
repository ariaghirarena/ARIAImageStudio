name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 · NSIS + portable
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Automated tests
        run: npm test

      - name: Build frontend bundle
        run: npm run build

      - name: Verify feature registry is in sync
        shell: bash
        run: |
          npm run features
          git diff --exit-code --ignore-cr-at-eol -- FEATURES-300.md

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cargo check
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          CARGO_TERM_COLOR: never
        run: |
          cargo check --message-format=short > cargo-check.log 2>&1
          status=$?
          python "$GITHUB_WORKSPACE/scripts/annotate-cargo.py" < cargo-check.log
          if [ "$status" -ne 0 ] && [ ! -s cargo-check.log ]; then
            echo "::error::cargo exited $status with an empty log"
          fi
          exit $status

      - name: Verify Windows console policy and image import
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --lib > console-test.log 2>&1
          status=$?
          python "$GITHUB_WORKSPACE/scripts/annotate-cargo.py" < console-test.log
          exit $status

      - name: Build Tauri bundle (NSIS)
        shell: bash
        working-directory: apps/desktop
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          npx tauri build --bundles nsis > tauri-build.log 2>&1
          status=$?
          python "$GITHUB_WORKSPACE/scripts/annotate-cargo.py" < tauri-build.log
          exit $status

      - name: Prepare portable executable
        shell: bash
        run: |
          mkdir -p artifacts
          cp "apps/desktop/src-tauri/target/release/aria-image-studio.exe" "artifacts/ARIA-Image-Studio-1.1.1-portable.exe"
          find apps/desktop/src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} "artifacts/ARIA-Image-Studio-1.1.1-setup.exe" \;
          cd artifacts && sha256sum *.exe > SHA256SUMS.txt && ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aria-image-studio-windows-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ARIA Image Studio ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## ARIA Image Studio ${{ github.ref_name }} — ویندوز ۶۴ بیتی

            افزودن عکس از کامپیوتر در گالری، ویرایش و ساخت تصویر (به‌عنوان مرجع).
            عکس در کتابخانه کپی می‌شود؛ فایل شخصی اصلی تغییر نمی‌کند. بدون نیاز به کلید API.
            رابط فارسی و راست‌به‌چپ، پوسته روشن و فونت پیدا.
            فرایندهای فرزند با CREATE_NO_WINDOW اجرا می‌شوند؛ آزمون خودکار ویندوز، نداشتن پنجره کنسول را بررسی می‌کند.

            **نصب:** فایل `ARIA-Image-Studio-1.1.1-setup.exe` را اجرا کنید.
            **بدون نصب:** از فایل `ARIA-Image-Studio-1.1.1-portable.exe` استفاده کنید.
            حساب‌ها و پروژه‌های قبلی حفظ می‌شوند؛ ظاهر نصب قبلی به روشن و فارسی تغییر می‌کند.

            پیش‌نیاز: ویندوز ۱۰ یا ۱۱ نسخه x64، محیط WebView2 و ابزار رسمی Codex.
            نصب Codex: `npm install -g @openai/codex`؛ سپس در برنامه به حساب خود وارد شوید.
            نیازی به کلید API نیست. دسترسی تصویرسازی به امکانات حساب شما بستگی دارد.

            نصب‌کننده امضای دیجیتال ندارد و ممکن است SmartScreen هشدار بدهد.
            برای بررسی صحت فایل، از `SHA256SUMS.txt` استفاده کنید.
            ساخت و ویرایش با حساب واقعی و بررسی چشمی همه تب‌ها پس از نصب هنوز تأیید نشده‌اند.
            راهنمای کامل و منبع قلم در `docs/RELEASE-1.1.1.fa.md` است.
          files: artifacts/*
          fail_on_unmatched_files: true
